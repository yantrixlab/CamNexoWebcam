server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Clean URLs: /privacy serves privacy.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Installers: always saved as a file, never rendered in the browser
  location /downloads/ {
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires 1d;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
